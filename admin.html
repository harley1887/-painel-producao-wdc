<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atualizar Painel WDC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="box">
  <form class="card" id="login" onsubmit="return false">
    <h1>Atualizar o painel</h1>
    <div class="sub">Somente administrador</div>
    <label>E-mail<input id="em" type="email" autocomplete="username" required></label>
    <label>Senha<input id="pw" type="password" autocomplete="current-password" required></label>
    <button id="bt" type="submit">Entrar</button>
    <div class="msg" id="msg1"></div>
  </form>
  <div class="card" id="envio" hidden>
    <h1>Atualizar o painel</h1>
    <div class="sub" id="quem"></div>
    <div class="sub" id="atual">Última atualização: —</div>
    <label><span>1. Escolha as 3 planilhas .csv da pasta Painel (apontamentos, producao_ilheus e pcp_personalizada)</span><input id="csv" type="file" accept=".csv,text/csv" multiple></label>
    <div class="sub" id="csvres" style="text-align:left;margin:0"></div>
    <label><span>ou o arquivo dados.js mandado pelo Claude</span><input id="arq" type="file" accept=".js,.json"></label>
    <button id="env" type="button" disabled>2. Enviar para o painel</button>
    <div class="msg" id="msg2"></div>
  </div>
  <div class="card" id="lanc" hidden style="margin-top:16px">
    <h1>Lançamentos do Menu gerencial</h1>
    <div class="sub" id="lcnt">Carregando…</div>
    <button id="lcop" type="button" disabled>Copiar para colar na planilha</button>
    <textarea id="ltxt" readonly hidden style="font:12px ui-monospace,monospace;background:#0b0b0f;color:#ececf1;border:1px solid #2a2a33;border-radius:8px;min-height:90px;padding:8px"></textarea>
    <div class="msg" id="lmsg"></div>
    <div class="sub" style="text-align:left;margin:0">Como colar: abra a planilha, aba <b>APONTAMENTO</b>, clique na primeira célula vazia da coluna <b>Data</b> e aperte <b>Ctrl + V</b>. Depois clique em <b>Marcar como colados</b>.</div>
    <button class="sec" id="lok" type="button" disabled>Marcar como colados</button>
  </div>
  <div class="card" style="margin-top:16px;padding:16px 24px" hidden>
    <button class="sec" id="sair" type="button">Sair</button>
  </div>
</div>
<script>
// leitura das planilhas CSV: a mesma do Painel do executivo (Claude)
window.WDL = {};
(function(){ var dash = { loader: function(id, o){ WDL[id] = o.fn; } };
const apLoad = async ({ answer, call, args }) => {
const txt = (a) => typeof a === 'string' ? a : (a && typeof a.text === 'string' ? a.text : (Array.isArray(a && a.content) ? a.content.map((c) => c.text || '').join('') : JSON.stringify(a ?? '')));
const parse = (s) => {
const rows = []; let row = [], f = '', q = false;
for (let i = 0; i < s.length; i++) {
const c = s[i];
if (q) { if (c === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
else if (c === '"') q = true;
else if (c === ';') { row.push(f); f = ''; }
else if (c === '\n' || c === '\r') { if (c === '\r' && s[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
else f += c;
}
if (f !== '' || row.length) { row.push(f); rows.push(row); }
return rows;
};
// the connector answers one page at a time: follow its "re-call with startPage" footer
const pages = [];
let t = txt(answer);
for (let guard = 0; guard < 40; guard++) {
const m = t.match(/\n\s*\[page [^\]]*\]\s*$/);
if (!m && !t.includes('";"')) throw new Error(t.slice(0, 300));
pages.push(m ? t.slice(0, m.index) : t);

if (!next) break;
t = txt(await call('read_resource', { ...args, startPage: Number(next[1]) }));
}
let header = null; const body = [];
for (const p of pages) {
const rs = parse(p).filter((r) => r.some((c) => c.trim() !== ''));
if (!rs.length) continue;
const h = rs[0].map((x) => x.trim().toUpperCase());
if (!header) header = h;
for (let i = h.join('|') === header.join('|') ? 1 : 0; i < rs.length; i++) body.push(rs[i]);
}
if (!header) throw new Error('O arquivo veio vazio.');
const col = (name) => { const i = header.indexOf(name); if (i < 0) throw new Error('Coluna "' + name + '" não encontrada. Cabeçalho: ' + header.join(', ')); return i; };
const S = (v) => String(v ?? '').replace(/\s+/g, ' ').trim();
const num = (v) => { const s = S(v).replace(/\s/g, ''); if (!s) return 0; const c = /^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s) ? s.replace(/\./g, '').replace(',', '.') : s.replace(',', '.'); const x = Number(c); return Number.isFinite(x) ? x : 0; };
const day = (v) => { const s = S(v); let d = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (d) return d[3] + '-' + d[2].padStart(2, '0') + '-' + d[1].padStart(2, '0'); d = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (d) return d[0]; const n = Number(s); if (n > 30000 && n < 80000) return new Date(Math.round((n - 25569) * 864e5)).toISOString().slice(0, 10); return ''; };

const mins = (v) => { const s = S(v); const m = s.match(/^(\d+):(\d{2})(?::(\d{2}))?$/); if (m) return Number(m[1]) * 60 + Number(m[2]) + Number(m[3] || 0) / 60; const n = num(s); return n > 0 && n < 5 ? n * 1440 : 0; };
const hhmm = (v) => { const s = S(v); const m = s.match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, '0') + ':' + m[2] : ''; };
const iProd = col('PRODUTO');
const iInt = header.indexOf('INTEGRADOR'), iPes = header.findIndex((h) => h.startsWith('PESSOAS NA LINHA')), iAli = header.indexOf('ALIMENTADOR'), iEmb = header.indexOf('EMBALADOR');
const I = { data: col('DATA'), turno: col('TURNO'), linha: col('LINHA'), prog: iProd + 1, takt: col('TAKT TIME MEDIDO'), op: col('ORDEM DE PRODUÇÃO'), aloc: col('HORAS ALOCADAS DE PRODUÇÃO'), ini: col('INICIO PRODUÇÃO'), fim: col('FINAL DE PRODUÇÃO'), qtd: col('QUANTIDADE PRODUZIDA DURANTE AS HORAS ALOCADAS2'), gasto: col('HORAS PRODUZIDAS'), obs: col('OBSERVAÇÃO') };
const rows = [];
for (const r of body) {
const data = day(r[I.data]); if (!data) continue;
rows.push({ id: rows.length + 1, data, turno: S(r[I.turno]), linha: String(Number(r[I.linha]) || S(r[I.linha])), cod_pa: S(r[iProd]).replace(/\.0$/, ''), qtd_prog: Math.round(num(r[I.prog])), takt_s: Math.round(mins(r[I.takt]) * 60 * 10) / 10, op: S(r[I.op]), horas_aloc_min: Math.round(mins(r[I.aloc]) * 10) / 10, inicio: hhmm(r[I.ini]), fim: hhmm(r[I.fim]), qtd: Math.round(num(r[I.qtd])), horas_prod_min: Math.round(mins(r[I.gasto]) * 10) / 10, obs: S(r[I.obs]), integrador: iInt >= 0 ? S(r[iInt]) : '', nomes: iPes >= 0 ? S(r[iPes]) : '', alimentador: iAli >= 0 ? S(r[iAli]) : '', embalador: iEmb >= 0 ? S(r[iEmb]) : '' });
}
return { columns: ['id', 'data', 'turno', 'linha', 'cod_pa', 'qtd_prog', 'takt_s', 'op', 'horas_aloc_min', 'inicio', 'fim', 'qtd', 'horas_prod_min', 'obs', 'integrador', 'nomes', 'alimentador', 'embalador'], rows };
};

dash.loader('producao', {

const rows = []; let row = [], f = '', q = false;

else if (c === '"') q = true;
else if (c === ';') { row.push(f); f = ''; }
else if (c === '\n' || c === '\r') { if (c === '\r' && s[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }

}

// corrige o FABRICANTE pelo PART#: a marca sai do nome do produto e é personalizado quando o PART# diz serigrafado/personalizada
// (ou quando a planilha já diz personalizado e há número de pedido de venda)

const I = { data: col('DATA'), linha: col('LINHAS'), cod: col('COD. PA'), part: col('PART#'), prev: col('QUANT. PREVISTA'), real: col('QUANT. REAL'), ped: col('PEDIDO / PROPOSTA'), fab: col('FABRICANTE') };
const marcaPart = (part) => {
const P = S(part).toUpperCase(), has = (re) => re.test(P);
if (has(/^E4L/)) return 'EASY4LINK';
if (has(/HUAWEI/)) return 'HUAWEI';
if (has(/NOKIA/)) return 'NOKIA';
if (has(/TP[\s-]?LINK/)) return 'TP LINK';
if (has(/GRANDSTREAM/)) return 'GRANDSTREAM';
if (has(/\b(EG8|HG8|K562|WS7\d|MA5[68]|OPTIX|ECHOLIFE|NETENGINE|NE8000|S6[57]\d\d|H90\d|DC908|5008\d{4}|AX2S|AX3S)/)) return 'HUAWEI';
if (has(/\b(BEACON|BEAM|3TN|3FE|3HE|G-?1425|G-?2425|G-?2426|G-?1426|G-?0425|FX8|FGLT|FANT|FWLT|7750|7250)/)) return 'NOKIA';
if (has(/\b(GWN|GXP|GRP|GXV|GXW|HT8\d|UCM|WP8\d|GSC|DP7)/)) return 'GRANDSTREAM';
if (has(/\b(XC220|EX14\d|XX5\d\d|HB8\d\d|DECO|ARCHER)/)) return 'TP LINK';
if (has(/EASY4LINK/)) return 'EASY4LINK';
return '';
};
// marca mais frequente de cada código PA, contando só as linhas em que o PART# diz a marca
const porPA = {};
for (const r of body) { const m = marcaPart(r[I.part]), pa = S(r[I.cod]); if (m && pa) { const o = porPA[pa] = porPA[pa] || {}; o[m] = (o[m] || 0) + 1; } }
const marcaPA = (pa) => { const o = porPA[S(pa)]; if (!o) return ''; return Object.entries(o).sort((a, b) => b[1] - a[1])[0][0]; };
const fixFab = (part, fab, ped, pa) => {
const P = S(part).toUpperCase(), F = S(fab).toUpperCase();
const m = marcaPart(part) || marcaPA(pa) || F.split(/\s*-\s*/)[0].replace(/\s+/g, ' ').trim();
if (!m) return '';
const t = /SERIGRAF|PERSONALIZ/.test(P) || (/PERSONALIZ/.test(F) && /^\d{5,}/.test(S(ped))) ? 'PERSONALIZADO' : (/KIT/.test(F) || /^KIT\b/.test(P)) ? 'KIT' : 'NORMAL';
return m + ' - ' + t;
};
const rows = [];
for (const r of body) {
const data = day(r[I.data]); if (!data) continue;
const pedido = S(r[I.ped]);
rows.push({ id: rows.length + 1, data, ano: Number(data.slice(0, 4)), mes: Number(data.slice(5, 7)), linha: String(Number(r[I.linha]) || S(r[I.linha])), cod_pa: S(r[I.cod]), produto: S(r[I.part]), fabricante: fixFab(r[I.part], r[I.fab], pedido, r[I.cod]), fab_planilha: S(r[I.fab]), qtd_prevista: Math.round(num(r[I.prev])), qtd_real: Math.round(num(r[I.real])), pedido });
}
return { columns: ['id', 'data', 'ano', 'mes', 'linha', 'cod_pa', 'produto', 'fabricante', 'fab_planilha', 'qtd_prevista', 'qtd_real', 'pedido'], rows };
},
});
dash.loader('apont', {
description: 'Lê a cópia em CSV da aba APONTAMENTO (pasta L_PRODUÇÃO IOS/Painel), página por página, e transforma em linhas: data no formato ano-mês-dia, tempos em minutos e quantidades como números.',
fn: apLoad,
});
dash.loader('pcp', {
description: 'Lê a cópia em CSV da aba PERSONALIZADA do PCP (pasta L_PRODUÇÃO IOS/Painel) e transforma em linhas: datas no formato ano-mês-dia e quantidades como números.',
fn: async ({ answer, call, args }) => {
const txt = (a) => typeof a === 'string' ? a : (a && typeof a.text === 'string' ? a.text : (Array.isArray(a && a.content) ? a.content.map((c) => c.text || '').join('') : JSON.stringify(a ?? '')));
const parse = (s) => {

else if (c === '"') q = true;
else if (c === ';') { row.push(f); f = ''; }
else if (c === '\n' || c === '\r') { if (c === '\r' && s[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
else f += c;
}
if (f !== '' || row.length) { row.push(f); rows.push(row); }
return rows;
};
// the connector answers one page at a time: follow its "re-call with startPage" footer
const pages = [];
let t = txt(answer);
for (let guard = 0; guard < 40; guard++) {
const m = t.match(/\n\s*\[page [^\]]*\]\s*$/);
if (!m && !t.includes('";"')) throw new Error(t.slice(0, 300));
pages.push(m ? t.slice(0, m.index) : t);
const next = m && m[0].match(/re-call with startPage=(\d+)/);
if (!next) break;
t = txt(await call('read_resource', { ...args, startPage: Number(next[1]) }));
}
let header = null; const body = [];
for (const p of pages) {
const rs = parse(p).filter((r) => r.some((c) => c.trim() !== ''));
if (!rs.length) continue;
const h = rs[0].map((x) => x.trim().toUpperCase());
if (!header) header = h;
for (let i = h.join('|') === header.join('|') ? 1 : 0; i < rs.length; i++) body.push(rs[i]);
}
if (!header) throw new Error('O arquivo veio vazio.');
const col = (name) => { const i = header.indexOf(name); if (i < 0) throw new Error('Coluna "' + name + '" não encontrada. Cabeçalho: ' + header.join(', ')); return i; };
const S = (v) => String(v ?? '').replace(/\s+/g, ' ').trim();
const num = (v) => { const s = S(v).replace(/\s/g, ''); if (!s) return 0; const c = /^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s) ? s.replace(/\./g, '').replace(',', '.') : s.replace(',', '.'); const x = Number(c); return Number.isFinite(x) ? x : 0; };
const day = (v) => { const s = S(v); let d = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (d) return d[3] + '-' + d[2].padStart(2, '0') + '-' + d[1].padStart(2, '0'); d = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (d) return d[0]; const n = Number(s); if (n > 30000 && n < 80000) return new Date(Math.round((n - 25569) * 864e5)).toISOString().slice(0, 10); return ''; };

const iVal = header.findIndex((h) => h.startsWith('VALOR'));
const money = (v) => num(S(v).replace(/[^\d.,-]/g, ''));
const I = { modelo: col('MODELO'), mp: col('CODIGO MP'), pa: col('CODIGO PA'), qtd: col('QUANTIDADE'), st: col('STATUS'), ini: col('INICIO DE PRODUÇÃO'), fim: col('FIM DE PRODUÇÃO') };

});
})();
</script>
<script>
(function(){
  var ADMINS = [String(window.WD_ADMIN || '').toLowerCase(), 'lucas.barroso@wdcnet.com.br'];
  firebase.initializeApp(WD_FB);
  var auth = firebase.auth(), db = firebase.firestore(), col = db.collection('painel');
  var $ = function(i){ return document.getElementById(i); };
  function dizer(el, t, cls){ $(el).textContent = t; $(el).className = 'msg ' + (cls || ''); }
  var lido = null;

  function mostrarAtual(){
    col.doc('meta').get().then(function(m){
      $('atual').textContent = 'Última atualização: ' + (m.exists ? (m.data().gerado || '—') : 'nenhuma ainda');
    }).catch(function(){});
  }

  auth.onAuthStateChanged(function(u){
    var adm = u && ADMINS.indexOf((u.email || '').toLowerCase()) >= 0;
    $('login').hidden = !!adm; $('envio').hidden = !adm;
    if (u && !adm) { dizer('msg1', 'Este usuário não pode atualizar o painel.', 'erro'); auth.signOut(); }
    $('lanc').hidden = !adm; $('sair').parentNode.hidden = !adm;
    if (adm) { $('quem').textContent = u.email; mostrarAtual(); ouvir(); }
  });

  $('login').addEventListener('submit', function(){
    $('bt').disabled = true; dizer('msg1', 'Entrando...');
    auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value)
      .then(function(){ dizer('msg1', ''); })
      .catch(function(){ dizer('msg1', 'E-mail ou senha incorretos.', 'erro'); })
      .then(function(){ $('bt').disabled = false; });
  });
  $('sair').onclick = function(){ auth.signOut(); };

  // lançamentos salvos no Menu gerencial que ainda não foram para a planilha
  var pend = [], ouvindo = false;
  var pad = function(n){ return String(n).padStart(2, '0'); };
  var hms = function(m){ if (m == null || !isFinite(m)) return ''; var x = Math.round(m * 60); return pad(Math.floor(x / 3600)) + ':' + pad(Math.floor(x % 3600 / 60)) + ':' + pad(x % 60); };
  var hh = function(t){ return t ? t + ':00' : ''; };
  var br = function(d){ return d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : ''; };
  function ouvir(){
    if (ouvindo) return; ouvindo = true;
    db.collection('lancamentos').where('exportado', '==', false).onSnapshot(function(snap){
      pend = snap.docs.map(function(d){ return Object.assign({ _id: d.id }, d.data()); }).sort(function(a, b){ return (a.data + a.ini).localeCompare(b.data + b.ini); });
      $('lcnt').textContent = pend.length ? pend.length + (pend.length > 1 ? ' lançamentos novos para passar para a planilha' : ' lançamento novo para passar para a planilha') : 'Nenhum lançamento novo. Tudo já está na planilha.';
      $('lcop').disabled = !pend.length; $('lok').disabled = true; $('ltxt').hidden = true;
    }, function(e){ console.error(e); $('lcnt').textContent = 'Não foi possível ler os lançamentos.'; });
  }
  function linhas(){
    // mesma ordem das colunas da aba APONTAMENTO (Data até Embalador)
    return pend.map(function(r){
      var feito = Math.max(0, (Number(r.qtd) || 0) - (Number(r.sem) || 0));
      var obs = [r.pers ? 'Personalizado' + (r.cli ? ' ' + r.cli : '') : '', r.ped ? 'Pedido ' + r.ped : '', Number(r.sem) > 0 ? 'resta ' + r.sem : '', (r.paradas || []).length ? 'Paradas: ' + r.paradas.map(function(x){ return x.mot + ' ' + x.ini + '-' + x.fim + ' (' + x.min + ' min)'; }).join('; ') + ' · total ' + (r.parado_min || 0) + ' min' : ''].filter(Boolean).join(' · ');
      return [br(r.data), 'Manhã', pad(r.linha), r.cod, r.qtd, hms((Number(r.takt) || 0) / 60), r.op, hms(r.prev), hh(r.ini), hh(r.ini), hh(r.fim), feito, hms(r.real), obs, r.int || '', r.ali || '', r.emb || '']
        .map(function(v){ return String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' '); }).join('\t');
    }).join('\n');
  }
  $('lcop').onclick = function(){
    var t = linhas(), ta = $('ltxt');
    var ok = function(){ dizer('lmsg', 'Copiado! Agora cole na planilha (Ctrl + V).', 'ok'); $('lok').disabled = false; };
    var fb = function(){ ta.value = t; ta.hidden = false; ta.focus(); ta.select(); dizer('lmsg', 'Aperte Ctrl + C para copiar e depois cole na planilha.', 'ok'); $('lok').disabled = false; };
    try { navigator.clipboard.writeText(t).then(ok, fb); } catch (e) { fb(); }
  };
  $('lok').onclick = function(){
    if (!pend.length) return;
    var b = db.batch(); pend.forEach(function(r){ b.update(db.collection('lancamentos').doc(r._id), { exportado: true }); });
    $('lok').disabled = true;
    b.commit().then(function(){ dizer('lmsg', 'Pronto! Marcados como colados na planilha.', 'ok'); }).catch(function(e){ console.error(e); $('lok').disabled = false; dizer('lmsg', 'Não foi possível marcar. Tente de novo.', 'erro'); });
  };

  $('arq').addEventListener('change', function(){
    lido = null; $('env').disabled = true; dizer('msg2', '');
    var file = this.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var t = String(r.result), g = '';
        var mg = t.match(/window\.WD_GERADO\s*=\s*("(?:[^"\\]|\\.)*")/); if (mg) g = JSON.parse(mg[1]);
        var k = t.indexOf('window.WD_DADOS='); if (k < 0) throw 0;
        var j = t.slice(k + 16).trim().replace(/;\s*$/, '');
        var d = JSON.parse(j);
        if (!d.producao || !d.apont) throw 0;
        lido = { gerado: g, json: j };
        $('env').disabled = false;
        dizer('msg2', 'Arquivo ok' + (g ? ' (gerado em ' + g + ')' : '') + '. Clique em Enviar.', 'ok');
      } catch (e) { dizer('msg2', 'Este arquivo não é o dados.js do painel.', 'erro'); }
    };
    r.readAsText(file, 'utf-8');
  });

  // as 3 planilhas CSV do SharePoint (pasta L_PRODUÇÃO IOS / Painel)
  function texto(file){ return file.arrayBuffer().then(function(b){ var t; try { t = new TextDecoder('utf-8', { fatal: true }).decode(b); } catch (e) { t = new TextDecoder('windows-1252').decode(b); } return t.replace(/^\uFEFF/, ''); }); }
  function qual(n){ n = n.toLowerCase(); return /apont/.test(n) ? 'apont' : /produc/.test(n) ? 'producao' : /pcp|personaliz/.test(n) ? 'pcp' : ''; }
  function agora(){ var d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' às ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function maxData(rs){ var m = ''; rs.forEach(function(r){ if (r.data > m) m = r.data; }); return m; }
  $('csv').addEventListener('change', function(){
    lido = null; $('env').disabled = true; $('csvres').textContent = ''; dizer('msg2', '');
    var fs = Array.prototype.slice.call(this.files), F = {};
    fs.forEach(function(f){ var k = qual(f.name); if (k) F[k] = f; });
    var falta = ['apont', 'producao', 'pcp'].filter(function(k){ return !F[k]; });
    if (falta.length) { dizer('msg2', 'Faltou: ' + falta.map(function(k){ return { apont: 'apontamentos.csv', producao: 'producao_ilheus.csv', pcp: 'pcp_personalizada.csv' }[k]; }).join(', ') + '. Escolha os 3 arquivos juntos.', 'erro'); return; }
    dizer('msg2', 'Lendo as planilhas...');
    var D = {};
    Promise.all(['apont', 'producao', 'pcp'].map(function(k){
      return texto(F[k]).then(function(t){ return WDL[k]({ answer: t, args: {}, call: function(){ return Promise.resolve(''); } }); }).then(function(r){ D[k] = r.rows; });
    })).then(function(){
      // histórico antigo dos apontamentos (até 30/06/2026) vem do que já está no painel
      return col.doc('meta').get().then(function(m){
        if (!m.exists) throw new Error('sem-hist');
        var ps = []; for (var i = 0; i < m.data().partes; i++) ps.push(col.doc('p' + i).get());
        return Promise.all(ps);
      }).then(function(ds){
        var velho = JSON.parse(ds.map(function(d){ return d.data().s; }).join(''));
        var h = (velho.apont || []).filter(function(r){ return r.data <= '2026-06-30'; });
        if (!h.length) throw new Error('sem-hist');
        var mx = maxData(h);
        D.apont = h.concat(D.apont.filter(function(r){ return r.data > mx; })).map(function(r, i){ return Object.assign({}, r, { id: i + 1 }); });
      });
    }).then(function(){
      if (!D.producao.length || !D.apont.length) throw new Error('vazio');
      var g = agora();
      lido = { gerado: g, json: JSON.stringify(D) };
      $('csvres').textContent = 'Produção: ' + D.producao.length.toLocaleString('pt-BR') + ' linhas até ' + br(maxData(D.producao)) + ' · Apontamentos: ' + D.apont.length.toLocaleString('pt-BR') + ' até ' + br(maxData(D.apont)) + ' · PCP: ' + D.pcp.length.toLocaleString('pt-BR') + ' pedidos';
      $('env').disabled = false;
      dizer('msg2', 'Planilhas ok. Confira o resumo acima e clique em Enviar.', 'ok');
    }).catch(function(e){
      console.error(e);
      dizer('msg2', e && e.message === 'sem-hist' ? 'Não achei o histórico no painel. Fale com o Harley.' : 'Não consegui ler as planilhas. Confira se são os 3 arquivos .csv da pasta Painel.', 'erro');
    });
  });

  $('env').onclick = function(){
    if (!lido) return;
    $('env').disabled = true; dizer('msg2', 'Enviando...');
    var T = 300000, partes = [], b = db.batch();
    for (var i = 0; i < lido.json.length; i += T) partes.push(lido.json.slice(i, i + T));
    partes.forEach(function(s, n){ b.set(col.doc('p' + n), { s: s }); });
    b.set(col.doc('meta'), { partes: partes.length, gerado: lido.gerado || new Date().toLocaleString('pt-BR'), enviado: firebase.firestore.FieldValue.serverTimestamp() });
    b.commit().then(function(){
      dizer('msg2', 'Pronto! O painel já está atualizado.', 'ok'); mostrarAtual();
    }).catch(function(e){
      console.error(e); $('env').disabled = false;
      dizer('msg2', e && e.code === 'permission-denied' ? 'Sem permissão para enviar.' : 'Falhou. Tente de novo.', 'erro');
    });
  };
})();
</script>
